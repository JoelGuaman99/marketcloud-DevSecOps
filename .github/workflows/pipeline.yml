name: MarketCloud DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      # =========================================================
      # 1. SAST - SQL INJECTION
      # =========================================================

      - name: Analizar version insegura
        shell: bash
        run: |
          echo "=== ANALISIS VERSION INSEGURA ==="

          if grep -q 'studentId' insecure/routes/payments.js && \
             grep -q '" + studentId' insecure/routes/payments.js; then
            echo "SAST RESULT"
            echo "Finding: SQL Injection"
            echo "Severity: HIGH"
            echo "File: insecure/routes/payments.js"
            echo "Evidence: User-controlled parameter studentId concatenated into SQL query."
            echo "Resultado esperado: VULNERABLE"
          else
            echo "ERROR: No se detecto el patron vulnerable esperado."
            exit 1
          fi

      - name: Analizar version segura
        shell: bash
        run: |
          echo "=== ANALISIS VERSION SEGURA ==="

          if grep -q 'WHERE student_id = \$1' secure/routes/payments.js; then
            echo "Parameterized query detected"
          else
            echo "ERROR: No se encontro consulta parametrizada."
            exit 1
          fi

          if grep -q 'db.query(query, \[requestedStudentId\])' secure/routes/payments.js; then
            echo "Parameterized value binding detected"
          else
            echo "ERROR: No se encontro binding del parametro."
            exit 1
          fi

          if grep -q '403' secure/routes/payments.js; then
            echo "Object-level authorization control detected"
          else
            echo "ERROR: No se encontro control de autorizacion."
            exit 1
          fi

          echo "SAST RESULT"
          echo "Finding: No SQL Injection pattern detected"
          echo "Authorization: Present"
          echo "Resultado esperado: SECURE"

      # =========================================================
      # 2. SECRET SCANNING
      # =========================================================

      - name: Analizar secreto en version insegura
        shell: bash
        run: |
          echo "=== ANALISIS DE SECRETOS - VERSION INSEGURA ==="

          if grep -q 'databasePassword: "MarketCloudDemoPassword123!"' insecure/routes/config.js; then
            echo "SECRET SCAN RESULT"
            echo "Finding: Hardcoded Database Credential"
            echo "Severity: HIGH"
            echo "File: insecure/routes/config.js"
            echo "Evidence: Database password stored directly in source code."
            echo "Decision: ROTATE / REMOVE"
            echo "Resultado esperado: VULNERABLE"
          else
            echo "ERROR: No se encontro el secreto esperado."
            exit 1
          fi

      - name: Verificar secreto en version segura
        shell: bash
        run: |
          echo "=== ANALISIS DE SECRETOS - VERSION SEGURA ==="

          if grep -q 'databasePassword: process.env.DB_PASSWORD' secure/routes/config.js; then
            echo "Environment variable reference detected"
          else
            echo "ERROR: No se detecto referencia segura a DB_PASSWORD."
            exit 1
          fi

          if grep -q 'MarketCloudDemoPassword123!' secure/routes/config.js; then
            echo "ERROR: El secreto hardcodeado sigue presente."
            exit 1
          fi

          echo "SECRET SCAN RESULT"
          echo "Finding: No hardcoded database credential detected"
          echo "Secret source: Environment variable"
          echo "Decision: ALLOW"
          echo "Resultado esperado: SECURE"

      # =========================================================
      # 3. SCA - DEPENDENCIAS
      # =========================================================

      - name: Analizar dependencia SCA en version insegura
        shell: bash
        run: |
          echo "=== ANALISIS SCA - VERSION INSEGURA ==="

          if grep -q '"pdf-generator-lib": "2.4.1"' insecure/routes/package.json; then
            echo "SCA RESULT"
            echo "Dependency: pdf-generator-lib 2.4.1"
            echo "Vulnerability: CVE-SIM-2025-1842"
            echo "Severity: MEDIUM"
            echo "Context: Generacion de comprobantes de pago"
            echo "Fixed version: 2.4.3"
            echo "Decision: UPDATE"
            echo "Resultado esperado: VULNERABLE"
          else
            echo "ERROR: No se encontro la dependencia vulnerable esperada."
            exit 1
          fi

      - name: Verificar dependencia SCA en version segura
        shell: bash
        run: |
          echo "=== ANALISIS SCA - VERSION SEGURA ==="

          if grep -q '"pdf-generator-lib": "2.4.3"' secure/routes/package.json; then
            echo "SCA RESULT"
            echo "Dependency: pdf-generator-lib 2.4.3"
            echo "Vulnerability: CVE-SIM-2025-1842 corregida"
            echo "Finding: Vulnerabilidad corregida mediante actualizacion"
            echo "Decision: ALLOW"
            echo "Resultado esperado: SECURE"
          else
            echo "ERROR: No se encontro la version corregida 2.4.3."
            exit 1
          fi

      # =========================================================
      # 4. API AUTHORIZATION TEST
      # =========================================================

      - name: Prueba automatizada de autorizacion API
        shell: bash
        run: |
          echo "=== API AUTHORIZATION TEST ==="
          node test/api-authorization-test.js

      # =========================================================
      # 5. SECURITY GATE
      # =========================================================

      - name: Security Gate
        shell: bash
        run: |
          echo "========================================"
          echo "       SECURITY GATE - MARKETCLOUD"
          echo "========================================"
          echo "SAST: PASS"
          echo "Secret Scanning: PASS"
          echo "SCA: PASS"
          echo "API Authorization Test: PASS"
          echo "----------------------------------------"
          echo "SECURITY GATE: ALLOW"
          echo "La version segura cumple los controles."
          echo "========================================"